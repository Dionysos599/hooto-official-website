name: Deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static quality checks
        run: npm run qa

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tooling
        run: python3 -m pip install -r tools/image-requirements.txt

      - name: Generate responsive images
        run: python3 tools/generate-image-derivatives.py

      - name: Generate gallery image list
        run: node tools/generate-gallery-data.mjs

      - name: Generate SEO discovery files
        run: node tools/generate-seo-files.mjs

      - name: Validate and assemble site artifact
        run: npm run build:site

      - name: Install Alibaba Cloud OSS utility
        run: |
          curl -fsSL -o /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  /tmp/ossutil.zip" \
            | sha256sum --check
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil
          install -m 0755 /tmp/ossutil/ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Deploy to Alibaba Cloud OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: ossutil sync _site/ oss://hooto/ --force

      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@v1

      - name: Refresh Alibaba Cloud CDN
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_REGION_ID: cn-shanghai
        run: |
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "https://www.hooto.com.cn/" \
            --ObjectType Directory

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          exclude_assets: '.github,CNAME'
          commit_message: Deploy website
