name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static quality checks
        run: npm run qa

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tooling
        run: python3 -m pip install -r tools/image-requirements.txt

      - name: Generate responsive images
        run: python3 tools/generate-image-derivatives.py

      - name: Generate gallery image list
        run: node tools/generate-gallery-data.mjs

      - name: Generate SEO discovery files
        run: node tools/generate-seo-files.mjs

      - name: Validate and assemble site artifact
        run: npm run build:site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          exclude_assets: '.github,CNAME'
          commit_message: Deploy website
